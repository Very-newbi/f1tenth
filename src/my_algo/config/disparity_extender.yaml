disparity_extender:
  ros__parameters:
    scan_topic: /scan
    joy_active_topic: /joy_active
    autonomous_mode_topic: /autonomous_mode
    motor_speed_topic: /planner/motor/speed
    servo_position_topic: /planner/servo/position

    require_autonomous_mode: true

    # Use 0.0 when /scan is generated in base_link.
    # Use 90.0 only when /scan is still in the raw Livox frame.
    lidar_yaw_offset_deg: 0.0
    front_fov_deg: 180.0
    max_range_m: 12.0
    min_range_m: 0.08
    smoothing_window: 3
    disparity_threshold_m: 0.45
    car_width_m: 0.31
    safety_margin_m: 0.12
    target_range_ratio: 0.92
    center_angle_weight: 0.35

    steering_gain: 1.0
    max_steer_rad: 0.28
    steering_deadband_rad: 0.04
    steering_filter_alpha: 0.25

    min_speed_mps: 0.6
    base_speed_mps: 1.6
    max_speed_mps: 2.5
    straight_steer_rad: 0.08
    corner_steer_rad: 0.25
    slow_clearance_m: 1.0
    stop_clearance_m: 0.28
    speed_ramp_rate_mps2: 2.5

    erpm_gain: 4614.0
    min_drive_erpm: 1850.0
    servo_center: 0.5
    servo_gain: 0.28
